name: explainer-engine

services:
  postgres:
    image: postgres:16-alpine
    container_name: explainer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: explainer
      POSTGRES_PASSWORD: explainer
      POSTGRES_DB: explainer
      # Deterministic collation so ORDER BY does not drift between machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U explainer -d explainer']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: explainer-redis
    restart: unless-stopped
    # BullMQ keeps completed jobs for a week; never let Redis evict them.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: explainer-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API — matches S3_ENDPOINT in .env.example
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates the renders bucket, then exits 0. `depends_on` with
  # `service_completed_successfully` lets the API wait for it if you add it.
  createbuckets:
    image: minio/mc:latest
    container_name: explainer-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/renders &&
      mc anonymous set download local/renders &&
      echo 'bucket renders ready'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
